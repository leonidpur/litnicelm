conf:
  version: "1"

device: cpu
transformer_layers: 0
parameter_bytes: 0
optimizer_bytes: 0
arena_alignment: 64
max_steps: 1

backend:
  #library: ""
  #library: "./build-debug/liblitnice_backend_cpu.so"
  #library: "./build-debug/liblitnice_backend_openblas_plugin.so"
  library: "./build/liblitnice_backend_openblas_plugin.so"
  #library: "./build/liblitnice_backend_cpu.so"

tokenizer:
  # Factory-facing tokenizer implementation id.
  # Preferred values: "sentencepiece", "character", "only_seen_chars"
  type: "only_seen_chars"
  target_vocab_size: 128

  # Preferred normalized plugin config.
  training_corpus: "/mnt/ext_ssd/litnicegpt/data/syntetic1.txt"
  artifacts_dir: "/mnt/ext_ssd/litnicegpt/data"
  bpe_vocab_file: ""
  bpe_merges_file: ""

  # Plugin/validation settings.
  bpe_validation_num_threads: 1
  bpe_validation_sample_rate: 50
  run_validation: true
  
  # Future shape:
  # params:
  #   model_type: "bpe"
  #   character_coverage: 1.0
  # validation:
  #   enabled: true
  #   num_threads: 1
  #   sample_rate: 50

tokenization:
  input_corpus: "/mnt/ext_ssd/litnicegpt/data/syntetic1.txt"
  output_binary: "/mnt/ext_ssd/litnicegpt/data/tokenized_dataset_syntetic1.bin"
  chunk_size_mb: 64

memory:
  alignment_bytes: 64

model:
  n_layers: 2
  n_heads: 2
  d_model: 32
  d_ff: 64
  window_capacity: 8

training:
  learning_rate: 0.002
  beta1: 0.9
  beta2: 0.999
  eps: 0.00000001
  weight_decay: 0.01
  incremental: true
  dry_run: false
  num_epochs_train: 33 # Small models need many passes to memorize single-author style.
  num_epochs_dry_run: 2
  save_interval_epochs: 5 # Enough save points without creating too many checkpoints.
  grad_clip: 1.0
  window_training: 4
  batch_size: 2 # 16-32: stable gradients without requiring massive RAM.

paths:
  model_file: "/mnt/ext_ssd/litnicegpt/data/char_book_syntetic1.ckpt"
  journal_file: "/mnt/ext_ssd/litnicegpt/data/journal.txt"

inference:
  window_inference: 64

logging:
  show_bpe: true
  show_train: true
  show_inference: true
  report_every_n_steps: 1
  epoch_report_every: 13

reporting:
  # k: start epoch index, m: duration (-1 for till the end)
  # [k, m] -> [-1, 0] disables educational reports. Not used yet.
  verbose_epoch_index: [0, 1]
  # If true, provide deep-dives during memory allocation and tensor setup.
  verbose_init: true
