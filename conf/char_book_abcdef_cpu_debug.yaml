conf:
  version: "1"

transformer_layers: 0
parameter_bytes: 0
optimizer_bytes: 0
arena_alignment: 64
max_steps: 1

backend:
  library: "./build/liblitnice_backend_cpu.so"

tokenizer:
  type: "only_seen_chars"
  target_vocab_size: 128
  training_corpus: "/mnt/ext_ssd/litnicegpt/data/syntetic1.txt"
  artifacts_dir: "/mnt/ext_ssd/litnicegpt/data"
  bpe_vocab_file: ""
  bpe_merges_file: ""
  bpe_validation_num_threads: 1
  bpe_validation_sample_rate: 50
  run_validation: true

tokenization:
  input_corpus: "/mnt/ext_ssd/litnicegpt/data/syntetic1.txt"
  output_binary: "/mnt/ext_ssd/litnicegpt/data/tokenized_dataset_syntetic1.bin"
  chunk_size_mb: 64

memory:
  alignment_bytes: 64

model:
  n_layers: 2
  n_heads: 2
  d_model: 32
  d_ff: 64
  max_seq_len: 8

training:
  train_seq_len: 8
  window_stride: 1
  batch_size: 1
  num_epochs_train: 1600
  num_epochs_dry_run: 2
  save_interval_epochs: 5
  patience_epochs: 0
  learning_rate: 0.001
  beta1: 0.9
  beta2: 0.999
  eps: 0.00000001
  weight_decay: 0.01
  incremental: true
  dry_run: false
  grad_clip: 1.0
  target_loss: 0.1
  min_delta: 0.0
  min_epochs: 0
  stop_on_nonfinite_loss: true

paths:
  model_file_latest: "/mnt/ext_ssd/litnicegpt/data/char_book_syntetic1_latest.ckpt"
  model_file_best: "/mnt/ext_ssd/litnicegpt/data/char_book_syntetic1_latest.ckpt"
  journal_file: "/mnt/ext_ssd/litnicegpt/data/journal.txt"

inference:
  prompt: ""
  max_new: 64
  temp: 1.0
  top_k: 0
  top_p: 1.0
  seed: 12345

logging:
  show_bpe: true
  show_train: true
  show_inference: true
  report_every_n_steps: 1
  epoch_report_every: 13

reporting:
  verbose_epoch_index: [0, 1]
  verbose_init: true
