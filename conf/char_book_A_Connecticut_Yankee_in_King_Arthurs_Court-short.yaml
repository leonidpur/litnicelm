conf:
  version: "1"

transformer_layers: 0
parameter_bytes: 0
optimizer_bytes: 0
arena_alignment: 64
max_steps: 1

backend:
  #library: "./build/liblitnice_backend_cpu.so"
  #library: "./build/liblitnice_backend_openblas_plugin.so"
  #library: "./build-debug/liblitnice_backend_openblas_plugin.so"
  library: "./build/liblitnice_backend_cublas_plugin.so"

tokenizer:
  # Factory-facing tokenizer implementation id.
  # Preferred values: "sentencepiece", "character".
  type: "sentencepiece"
  target_vocab_size: 1248

  # Preferred normalized plugin config.
  training_corpus: "/mnt/ext_ssd/litnicelm/data/A_Connecticut_Yankee_in_King_Arthurs_Court-short.txt"
  artifacts_dir: "/mnt/ext_ssd/litnicelm/data/bpe_A_Connecticut_Yankee_in_King_Arthurs_Court-short"
  bpe_vocab_file: ""
  bpe_merges_file: ""

  # Plugin/validation settings.
  bpe_validation_num_threads: 1
  bpe_validation_sample_rate: 50
  run_validation: true
  
  # Future shape:
  # params:
  #   model_type: "bpe"
  #   character_coverage: 1.0
  # validation:
  #   enabled: true
  #   num_threads: 1
  #   sample_rate: 50

tokenization:
  input_corpus: "/mnt/ext_ssd/litnicelm/data/A_Connecticut_Yankee_in_King_Arthurs_Court-short.txt"
  output_binary: "/mnt/ext_ssd/litnicelm/data/A_Connecticut_Yankee_in_King_Arthurs_Court-short_tokenized_dataset.bin"
  chunk_size_mb: 64

memory:
  alignment_bytes: 64

model:
  #max_seq_len: 512
  max_seq_len: 240
  #n_layers: 12
  n_layers: 2
  n_heads: 8
  #d_model: 512
  d_model: 64
  d_ff: 256

training:
  learning_rate: 0.001
  beta1: 0.9
  beta2: 0.999
  eps: 0.00000001
  weight_decay: 0.01
  incremental: false
  dry_run: false
  num_epochs_train: 273 # Small models need many passes to memorize single-author style.
  num_epochs_dry_run: 2
  save_interval_epochs: 5 # Enough save points without creating too many checkpoints.
  grad_clip: 1.0
  train_seq_len: 15
  window_stride: 240
  batch_size: 16 # 16-32: stable gradients without requiring massive RAM.
  target_loss: 1.75
  min_delta: 0.01
  patience_epochs: 27
  min_epochs: 0
  stop_on_nonfinite_loss: true

paths:
  model_file_latest: "/mnt/ext_ssd/litnicelm/data/A_Connecticut_Yankee_in_King_Arthurs_Court-short_latest.ckpt"
  model_file_best: "/mnt/ext_ssd/litnicelm/data/A_Connecticut_Yankee_in_King_Arthurs_Court-short_best.ckpt"
  journal_file: "/mnt/ext_ssd/litnicelm/data/journal.txt"

inference:
  prompt: ""
  max_new: 64
  temp: 1.0
  top_k: 0
  top_p: 1.0
  seed: 12345

logging:
  show_bpe: true
  show_train: true
  show_inference: true
  report_every_n_steps: 1
  epoch_report_every: 100

reporting:
  # k: start epoch index, m: duration (-1 for till the end)
  # [k, m] -> [-1, 0] disables educational reports.
  verbose_epoch_index: [0, 5]
  # If true, provide deep-dives during memory allocation and tensor setup.
  verbose_init: true
