tokenizer:
  # Factory-facing tokenizer implementation id.
  type: "character"
  target_vocab_size: 256

  # Preferred normalized tokenizer shape.
  training_corpus: "data/abc.txt"
  artifacts_dir: "data/bpe_char_abc"
  chunk_size_mb: 64

  # Legacy BPE-specific file keys remain only for the legacy tokenizer path.
  bpe_vocab_file: "data/bpe_char_abc/vocab.txt"
  bpe_merges_file: "data/bpe_char_abc/merges.txt"
  run_validation: true
  bpe_validation_num_threads: 8
  bpe_validation_sample_rate: 100

tokenization:
  input_corpus: "data/abc.txt"
  output_binary: "data/abc_tokenized.bin"
  chunk_size_mb: 64

model:
  window_capacity: 8
  n_layers: 3
  n_heads: 1
  d_model: 64
  d_ff: 32

training:
  incremental: false
  window_training: 4
  batch_size: 16 # 16-32: stable gradients without requiring massive RAM.
  num_epochs_train: 20 # Small models need many passes to memorize single-author style.
  num_epochs_dry_run: 1
  learning_rate: 0.001
  save_interval_epochs: 5 # Enough save points without creating too many checkpoints.

paths:
  model_file: "checkpoints/char_abc.ckpt"
  journal_file: "journal/journal.txt"

inference:
  window_inference: 64

reporting:
  # k: start epoch index, m: duration (-1 for till the end)
  # [k, m] -> [-1, 0] disables educational reports.
  verbose_epoch_index: [0, 5]
  # If true, provide deep-dives during memory allocation and tensor setup.
  verbose_init: true
