conf:
  version: "1"

transformer_layers: 0
parameter_bytes: 0
optimizer_bytes: 0
arena_alignment: 64
max_steps: 1

backend:
  library: "./build/liblitnice_backend_cpu.so"

tokenizer:
  type: "character"
  target_vocab_size: 256
  training_corpus: "data/synthetic_50_lines.txt"
  artifacts_dir: "data/char_synthetic_50_artifacts"
  bpe_vocab_file: ""
  bpe_merges_file: ""
  run_validation: false
  bpe_validation_num_threads: 1
  bpe_validation_sample_rate: 100

tokenization:
  input_corpus: "data/synthetic_50_lines.txt"
  output_binary: "data/synthetic_50_lines_tokenized.bin"
  chunk_size_mb: 16

memory:
  alignment_bytes: 64

model:
  max_seq_len: 128
  n_layers: 2
  n_heads: 2
  d_model: 32
  d_ff: 64

training:
  learning_rate: 0.002
  beta1: 0.9
  beta2: 0.999
  eps: 0.00000001
  weight_decay: 0.01
  incremental: false
  dry_run: false
  num_epochs_train: 40
  num_epochs_dry_run: 1
  save_interval_epochs: 5
  grad_clip: 1.0
  train_seq_len: 32
  window_stride: 8
  batch_size: 4
  target_loss: -1.0
  min_delta: 0.0
  patience_epochs: 0
  min_epochs: 0
  stop_on_nonfinite_loss: true

paths:
  model_file_latest: "checkpoints/char_synthetic_50_cpu_latest.ckpt"
  model_file_best: "checkpoints/char_synthetic_50_cpu_best.ckpt"
  journal_file: "journal/char_synthetic_50_cpu_journal.txt"

inference:
  prompt: "the"
  max_new: 64
  temp: 1.0
  top_k: 0
  top_p: 1.0
  seed: 12345

logging:
  show_bpe: true
  show_train: true
  show_inference: true
  report_every_n_steps: 1
  epoch_report_every: 10

reporting:
  verbose_epoch_index: [0, 2]
  verbose_init: true
