conf:
  version: "1"

transformer_layers: 0
parameter_bytes: 0
optimizer_bytes: 0
arena_alignment: 64
max_steps: 1

backend:
  library: "./build/liblitnice_backend_cublas_plugin.so"

tokenizer:
  # Overfit-oriented setup: exact seen characters only.
  type: "only_seen_chars"
  target_vocab_size: 128

  training_corpus: "/mnt/ext_ssd/litnicegpt/data/tinyshakespeare-short.txt"
  artifacts_dir: "/mnt/ext_ssd/litnicegpt/data/tinyshakespeare-short-memorize"
  bpe_vocab_file: ""
  bpe_merges_file: ""

  bpe_validation_num_threads: 1
  bpe_validation_sample_rate: 50
  run_validation: true

tokenization:
  input_corpus: "/mnt/ext_ssd/litnicegpt/data/tinyshakespeare-short.txt"
  output_binary: "/mnt/ext_ssd/litnicegpt/data/tinyshakespeare-short-memorize_tokenized_dataset.bin"
  chunk_size_mb: 64

memory:
  alignment_bytes: 64

model:
  # Keep one long single-stream context. Batch stays at 1.
  max_seq_len: 384
  n_layers: 4
  n_heads: 8
  d_model: 256
  d_ff: 1024

training:
  # Deliberately overfit-oriented.
  learning_rate: 0.0003
  beta1: 0.9
  beta2: 0.95
  eps: 0.00000001
  weight_decay: 0.0
  incremental: false
  dry_run: false
  # With stride=1, each epoch now sweeps almost every possible next-token context.
  num_epochs_train: 40
  num_epochs_dry_run: 2
  save_interval_epochs: 2
  grad_clip: 0.5
  train_seq_len: 384
  window_stride: 1
  batch_size: 1
  target_loss: 0.15
  min_delta: 0.001
  patience_epochs: 12
  min_epochs: 8
  stop_on_nonfinite_loss: true

paths:
  model_file_latest: "/mnt/ext_ssd/litnicegpt/data/tinyshakespeare-short-memorize_latest.ckpt"
  model_file_best: "/mnt/ext_ssd/litnicegpt/data/tinyshakespeare-short-memorize_best.ckpt"
  journal_file: "/mnt/ext_ssd/litnicegpt/data/journal.txt"

inference:
  # Exact corpus prefix by default and deterministic decoding.
  prompt: "First Citizen:\n"
  max_new: 256
  temp: 0.0
  top_k: 1
  top_p: 1.0
  seed: 12345

logging:
  show_bpe: true
  show_train: true
  show_inference: true
  report_every_n_steps: 1000
  epoch_report_every: 1

reporting:
  verbose_epoch_index: [0, 3]
  verbose_init: false
